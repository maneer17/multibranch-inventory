# Included by heroku-php-apache2 via `-C apache_app.conf` (see Procfile).
# mod_deflate, mod_filter and mod_headers are already loaded by the buildpack.

# -C replaces the buildpack's default include, whose only content is this line.
# Without it `/` has no index.php to serve and returns 403.
DirectoryIndex index.php index.html index.htm

AddOutputFilterByType DEFLATE text/html text/css text/javascript application/javascript application/json image/svg+xml

# Filament and Livewire asset URLs are versioned (?v=, ?id=, hashed filenames),
# so a changed file always gets a new URL and long caching is safe.
<LocationMatch "^/(css|js|fonts)/filament/|^/vendor/livewire/">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>
